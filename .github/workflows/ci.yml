name: CI

on:
  push:
    branches: [main, launch]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"          # the oldest Python the README promises
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools (CI only; Cody itself needs nothing from pip)
        run: python -m pip install --disable-pip-version-check ruff==0.16.8 coverage==7.16.2
      - name: Lint Python
        run: ruff check .
      - name: Check JavaScript syntax
        run: for f in web/js/*.js; do node --check "$f"; done
      - name: Python tests with coverage
        run: |
          coverage run --source=cody -m unittest discover tests
          coverage report --fail-under=65
      - name: JavaScript tests with coverage
        run: node --test --experimental-test-coverage --test-coverage-lines=85 "tests/js/*.test.mjs"

  plugin:
    name: Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the plugin and its marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.318 plugin validate .
