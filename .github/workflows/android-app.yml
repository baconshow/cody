name: Android app

# Builds the Android app (android/): the unit tests, a debug APK to try on a phone, and the release bundle for
# Google Play. The bundle is signed only when the repository has the upload key in its secrets
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD); without them it is
# built unsigned, which is enough to see that it builds.
on:
  push:
    branches: [main, launch]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android-app.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools    # the action's default asks for "tools", which the SDK no longer has
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload key (only when the secrets exist)
        if: ${{ env.KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > keystore.properties
      - name: Tests, debug APK, release bundle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Cody-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Cody-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
