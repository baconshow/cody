name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not paste API keys, tokens, Tailscale addresses or anything private.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python cody.py --doctor` (or the Status screen)
      render: text
  - type: input
    id: system
    attributes:
      label: System, browser and Claude Code version
      placeholder: Windows 11, Chrome on Android, Claude Code 2.1.x
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Cody?
      options: [Windows app (CodySetup.exe), Claude Code plugin, From source]
