<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Everything comes from this server: no CDN, so the page works without internet. Scripts and styles from here
       only; nothing inline. The font (Varela Round, SIL OFL, web/fonts/) is declared in style.css with
       font-display: swap, so the face never waits for it. Served at / the server swaps the cody-token marker for the
       token and the face reads Claude's state and activity (connect-src 'self'); opened as /web/index.html the
       marker stays as it is and the face fetches nothing. three.js for the 3D mascot lives in web/vendor/three (MIT)
       and is mapped by the importmap: the only inline script, allowed by its hash in the CSP (the hash must match the
       importmap byte for byte). darkreader-lock: the browser's dark mode does not repaint the face. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-GEeYoynGz3DCPEFT6nN+XRCJrWn8IqIqHTKRMB2Cg+w='; style-src 'self'; font-src 'self'; img-src 'self' blob:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="cody-token" content="{{CODY_TOKEN}}">
  <meta name="color-scheme" content="dark">
  <meta name="darkreader-lock">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A desk mascot for Claude Code.">
  <!-- on the phone's home screen: opens without the browser bar, like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cody">
  <title>Cody</title>
  <link rel="icon" href="/web/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/web/icon-180.png">
  <link rel="manifest" href="/web/app.webmanifest">
  <link rel="stylesheet" href="/web/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "/web/vendor/three/build/three.module.js",
      "three/": "/web/vendor/three/"
    }
  }
  </script>
  <script type="module" src="/web/js/main.js"></script>
</head>
<body>
  <main id="mascot" class="mascot"></main>
</body>
</html>
